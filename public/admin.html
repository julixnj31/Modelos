<meta charset="UTF-8" />
<title>Sistema de Tareas - Panel Admin</title>
<link rel="stylesheet" href="/css/style.css" />

<header>
  <h1>Panel de Administracion</h1>
  <button id="logout-btn">Cerrar sesion</button>
</header>

<main>
  <div class="stats-grid" id="stats-grid"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="usuarios">Usuarios</button>
    <button class="tab-btn" data-tab="tareas">Tareas</button>
  </div>

  <section id="tab-usuarios">
    <div class="card">
      <h2 id="user-form-title">Crear usuario</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />
        <label for="user-name">Nombre</label>
        <input type="text" id="user-name" required />

        <label for="user-email">Correo</label>
        <input type="email" id="user-email" required />

        <label for="user-password">Contrasena <span id="password-hint" style="font-weight:normal;color:#616e7c;"></span></label>
        <input type="password" id="user-password" />

        <label for="user-role">Rol</label>
        <select id="user-role">
          <option value="user">Usuario</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit" class="primary">Guardar usuario</button>
        <button type="button" class="secondary" id="user-form-cancel" style="margin-left:8px;">Cancelar edicion</button>
        <p class="error-message" id="user-error"></p>
      </form>
    </div>

    <div class="card">
      <h2>Usuarios registrados</h2>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Status</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </section>

  <section id="tab-tareas" style="display:none;">
    <div class="card">
      <h2>Crear tarea</h2>
      <form id="task-form">
        <label for="task-title">Titulo</label>
        <input type="text" id="task-title" required />

        <label for="task-description">Descripcion</label>
        <textarea id="task-description" required></textarea>

        <label for="task-priority">Prioridad</label>
        <select id="task-priority">
          <option value="baja">Baja</option>
          <option value="media" selected>Media</option>
          <option value="alta">Alta</option>
        </select>

        <label>Asignar a usuarios</label>
        <div class="checkbox-list" id="task-users-checkboxes"></div>

        <button type="submit" class="primary">Crear tarea</button>
        <p class="error-message" id="task-error"></p>
      </form>
    </div>

    <div class="card">
      <h2>Filtrar tareas</h2>
      <div class="filters">
        <div>
          <label for="filter-status">Estado</label>
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_progreso">En progreso</option>
            <option value="completada">Completada</option>
          </select>
        </div>
        <div>
          <label for="filter-priority">Prioridad</label>
          <select id="filter-priority">
            <option value="">Todas</option>
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>
        <div>
          <label for="filter-user">Usuario</label>
          <select id="filter-user">
            <option value="">Todos</option>
          </select>
        </div>
        <div>
          <button type="button" class="primary" id="filter-btn">Filtrar</button>
          <button type="button" class="secondary" id="filter-clear-btn">Limpiar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Todas las tareas</h2>
      <table>
        <thead>
          <tr>
            <th>Titulo</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Asignados</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tasks-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
