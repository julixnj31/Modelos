<meta charset="UTF-8" />
<title>Sistema de Tareas - Login</title>
<link rel="stylesheet" href="/css/style.css" />

<div class="login-wrapper">
  <h1>Iniciar sesion</h1>
  <form id="login-form">
    <label for="email">Correo</label>
    <input type="email" id="email" required />

    <label for="password">Contrasena</label>
    <input type="password" id="password" required />

    <button type="submit" class="primary">Ingresar</button>
    <p class="error-message" id="error-message"></p>
  </form>

  <p style="font-size:12px;color:#616e7c;margin-top:16px;">
    Admin de prueba: admin@demo.com / admin123<br />
    Usuario de prueba: juan@demo.com / juan123
  </p>
</div>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
