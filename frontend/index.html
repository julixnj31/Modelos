<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Categorías y Productos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Gestión de Inventario</h1>
      <nav>
        <button class="tab active" data-tab="categories">Categorías</button>
        <button class="tab" data-tab="products">Productos</button>
      </nav>
    </header>

    <main>
      <section id="categories-section" class="section active">
        <h2>Categorías</h2>
        <div class="actions">
          <input type="text" id="category-name" placeholder="Nombre de la categoría">
          <button id="add-category">Agregar</button>
        </div>
        <table id="categories-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="categories-body"></tbody>
        </table>
      </section>

      <section id="products-section" class="section">
        <h2>Productos</h2>
        <table id="products-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Categoría</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
